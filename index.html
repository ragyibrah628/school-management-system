<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nambawala Secondary School Management System</title>
    <meta name="theme-color" content="#0b1d3f" />
    <meta name="application-name" content="Nambawala Sec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nambawala Sec" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      body { margin: 0; background: #f4f7fc; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0b1d3f; }
      .boot img { width: 84px; height: 84px; border-radius: 50%; background: #fff; padding: 4px; box-shadow: 0 10px 24px -12px rgba(15, 40, 90, .6), 0 0 0 3px #fde68a; }
      .boot p { margin: 0; font-weight: 700; font-size: 15px; letter-spacing: .02em; }
      .boot i { width: 120px; height: 4px; border-radius: 4px; background: #dbe5f5; overflow: hidden; position: relative; }
      .boot i::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 4px; background: #1d4ed8; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><img src="/icons/icon-192.png" alt="" width="84" height="84" /><p>Nambawala Secondary School</p><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
