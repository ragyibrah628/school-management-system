[build]
  base = "."
  command = "npm run build"
  publish = "dist"

# The service worker and the manifest must never be kept old by the browser,
# so a new version of the app reaches the teachers' phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
